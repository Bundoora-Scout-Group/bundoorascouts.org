<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" aria-labelledby="logo-title logo-description" viewBox="0 0 1600 1600">
  <title>Bundoora Scout Group</title>
  <desc>
    A white kangaroo on a sky-blue disc with a yellow border and bevelled red Bundoora Scout Group lettering.
  </desc>
  <defs>
    <filter id="b" width="120%" height="120%" x="-10%" y="-10%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" result="relief" stdDeviation="7"/>
      <feDiffuseLighting diffuseConstant="1.2" in="relief" lighting-color="#fff" result="diffuse" surfaceScale="17">
        <feDistantLight azimuth="225" elevation="45"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="diffuse" k1="1" operator="arithmetic" result="shaded"/>
      <feSpecularLighting in="relief" lighting-color="#fff" result="shine" specularConstant=".4" specularExponent="10" surfaceScale="17">
        <feDistantLight azimuth="225" elevation="45"/>
      </feSpecularLighting>
      <feComposite in="shine" in2="SourceAlpha" operator="in" result="highlights"/>
      <feBlend in="shaded" in2="highlights" mode="screen" result="lit"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in"/>
    </filter>
    <filter id="a" width="110%" height="110%" x="-5%" y="-5%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" result="relief" stdDeviation="6"/>
      <feDiffuseLighting diffuseConstant="1.42" in="relief" lighting-color="#fff" result="diffuse" surfaceScale="20">
        <feDistantLight azimuth="225" elevation="45"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="diffuse" k1=".75" k2=".25" operator="arithmetic" result="lit"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
