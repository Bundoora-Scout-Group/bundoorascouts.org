intro:
  heading: "About the Skills"
  paragraphs:
    - "The Outdoor Adventure Skills framework promotes exploration of, and progression through key outdoor pursuits. The Outdoor Adventure Skills reinforce what Scouting is well known for and compliments other personal progression opportunities provided by Scouting."
    - "Scouts have the opportunity to continuously build on these skills throughout their Scouting journey, starting with the Core foundation skills all the way to the Specialist skills."

joeys:
  stage_requirement: 1
  progressions_required: 3
  sv_oas_skills_url: "https://scoutsvictoria.com.au/activities-events/outdoor-adventure-skills/"
  sv_oas_overview_url: "https://scoutsvictoria.com.au/activities-events/outdoor-adventure-skills/what-are-outdoor-adventure-skills/"
  core_skills:
    - { name: "Camping", stage: 1, description: "Campcraft, hygiene, cooking, and shelter management in remote environments." }
    - { name: "Bushcraft", stage: 1, description: "Pioneering, survival skills, fire lighting, and minimal impact practices." }
    - { name: "Bushwalking", stage: 1, description: "Navigation, route planning, and leading expeditions through diverse terrain." }
  specialist_skills:
    - { name: "Alpine", stage: 1, description: "Cross-country skiing, downhill skiing, snowboarding, and snow survival." }
    - { name: "Cycling", stage: 1, description: "Mountain biking and cycle touring, including maintenance and route planning." }
    - { name: "Vertical", stage: 1, description: "Abseiling, rock climbing, and caving techniques and safety systems." }
    - { name: "Aquatics", stage: 1, description: "Swimming, lifesaving, snorkelling, surfing, SCUBA diving, and water safety." }
    - { name: "Paddling", stage: 1, description: "Canoeing, kayaking, and sea kayaking across flatwater and whitewater." }
    - { name: "Boating", stage: 1, description: "Sailing and powerboating, including navigation and seamanship." }

